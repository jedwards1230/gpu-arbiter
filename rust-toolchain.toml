# Pin an exact toolchain version for reproducible builds. `channel = "stable"`
# is a *moving* target — every CI run and every contributor machine resolves it
# to whatever is newest that day, so "reproducible" was aspirational, not real.
# The crate is edition 2024 and uses let-chains, so this must stay >= 1.88
# (rust-version in Cargo.toml, the crate's MSRV floor — the toolchain pin here
# is the exact version people actually build with, which can run ahead of it).
#
# To bump: pick a new stable release, `rustup toolchain install <version>`,
# confirm `cargo build --release`, `cargo test`, and the musl cross-build still
# pass, then update the version below in the same PR as any code changes that
# motivated the bump.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
