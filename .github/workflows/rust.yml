# Rust CI for the gpu-arbiter daemon (crate at repo root).
#
# Builds, formats, lints, and tests the crate inside a slim official `rust`
# container (toolchain preinstalled; no system libs needed — all deps are
# pure-Rust). The daemon is Linux-only at runtime but builds/tests anywhere; the
# Linux runner exercises the real (cfg-gated) code paths.
#
# The `windows` job guards the cross-platform invariant the Linux job cannot
# see. Every Linux-only crate is already behind
# `[target.'cfg(target_os = "linux")'.dependencies]`, but nothing enforced that
# the *first-party* code stayed portable — and it had not: seven unix-socket
# tests in `http.rs` referenced `std::os::unix` and `tokio::net::UnixListener`
# unconditionally, so `cargo test` for an MSVC target failed to compile with 18
# errors. That is invisible on a Linux-only matrix, which is exactly why this
# job exists.

name: Rust

run-name: "Rust CI — ${{ github.event_name }} on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Format check
        id: fmt
        run: cargo fmt --check

      - name: Clippy
        id: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        id: build
        run: cargo build --release

      - name: Test
        id: test
        run: cargo test

      # Prove the artifact we actually deploy (static musl — the same target
      # release.yml ships, and what packages the tray too) compiles on every PR,
      # not just the glibc build above.
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools
        run: apt-get update && apt-get install -y --no-install-recommends musl-tools

      - name: Build (musl static — deployed artifact)
        id: build_musl
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Build (release) | ${{ steps.build.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| Build (musl static) | ${{ steps.build_musl.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Native Windows runner rather than a cross-`check` from Linux: only a real
  # MSVC host can link the binary and actually *run* the test suite, which is
  # what catches a platform-conditional logic bug (as opposed to a compile
  # error, which a cross-`cargo check` would also surface).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add clippy
        run: rustup component add clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # No `cargo fmt` here — formatting is platform-independent and the Linux
      # job already gates it; running it twice only adds a second place to fail
      # for the same reason.
      - name: Clippy
        id: clippy_win
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        id: build_win
        run: cargo build --release

      - name: Test
        id: test_win
        run: cargo test

      # Smoke-test the client half of the binary, which is the whole point of
      # shipping a Windows build before the daemon is ported: `status` against a
      # daemon that is not running must exit 2 ("unreachable"), NOT 1
      # ("claimed"). earmark maps 2 — and any unexpected code — to
      # "degrade, don't block", so collapsing 2 into 1 would make an unreachable
      # daemon look like a permanently running game and silently wedge the
      # transcription pipeline.
      - name: Smoke-test CLI client (exit 2 = daemon unreachable)
        id: smoke_win
        shell: pwsh
        # The explicit `exit 0` at the end is load-bearing, not decoration. The
        # step under test deliberately exits NON-ZERO (2 = unreachable), and
        # GitHub's pwsh wrapper propagates a lingering $LASTEXITCODE as the
        # step's own result — so without it the step failed even though the
        # assertion had already printed OK. Capture the code immediately, then
        # end with an explicit success. `Write-Host` rather than `Write-Error`
        # for the failure path, too: under the wrapper's ErrorActionPreference
        # a Write-Error is itself a terminating error, which muddies which of
        # the two things actually failed.
        run: |
          $exe = ".\target\release\gpu-arbiter.exe"
          & $exe --version
          & $exe status --url http://127.0.0.1:1 --quiet
          $code = $LASTEXITCODE
          if ($code -ne 2) {
            Write-Host "FAIL: expected exit 2 (daemon unreachable), got $code"
            exit 1
          }
          Write-Host "OK: unreachable daemon reported exit 2"
          exit 0

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Rust CI (Windows)"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Clippy | ${{ steps.clippy_win.outcome }} |"
            echo "| Build (release) | ${{ steps.build_win.outcome }} |"
            echo "| Test | ${{ steps.test_win.outcome }} |"
            echo "| CLI smoke test | ${{ steps.smoke_win.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
