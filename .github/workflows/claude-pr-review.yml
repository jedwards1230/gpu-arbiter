# Claude PR review — calls the shared reusable workflow in
# jedwards1230/release-workflows, which runs claude-code-action@v1 in Haiku
# PR-review mode with the public jedwards1230-plugins marketplace + review-team
# plugin enabled by default. The focus below is appended to the base prompt.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.action != 'closed'
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # preferred (subscription)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      draft_on_blocking: true
      extra_plugins: |
        rust-quality@jedwards1230-plugins
      focus: |
        gpu-arbiter is a daemon that evicts GPU compute tenants when a game
        launches and restores them when gaming ends. Game detection runs over
        cn_proc netlink on Linux and process enumeration on Windows, feeding a
        level-triggered reconcile task that is the sole owner of state and the
        sole caller of unit start/evict. Eviction drives managed units via
        systemd or per-unit `*_cmd` overrides, through yield -> stop -> SIGKILL
        stages. The daemon exposes an axum HTTP read surface plus a unix
        control socket, and calls tenant hook commands (`busy_cmd`/`yield_cmd`/
        `resume_cmd`). Shutdown is coordinated via a CancellationToken.
        - Concurrency: races between the reconcile task and HTTP handlers;
          spawn_blocking misuse.
        - Rust correctness: unwrap()/expect() on fallible paths.
        - Shell-free argv handling of config-supplied commands.
        - Unix-socket permission handling.
        - When the diff touches Rust, prioritize the rust-quality:rust-reviewer agent for language-specific Rust review.
        Do NOT re-flag rustfmt/clippy findings — CI lints already own those.

  cancel-review:
    if: github.event.action == 'closed'
    permissions:
      actions: write
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review-cancel.yml@v1
    with:
      review_workflow: "PR Review"
