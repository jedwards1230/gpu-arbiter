[package]
name = "gpu-arbiter"
# Not the release source of truth — release.yml stamps the real tag onto the
# ephemeral tagged checkout only. Bump this by hand alongside a release PR.
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "GPU arbiter daemon: evicts GPU compute tenants (e.g. Ollama) when a game launches (kernel cn_proc detection), restores them when gaming ends, exposes an HTTP /status endpoint for remote AI-routing decisions"
repository = "https://github.com/jedwards1230/gpu-arbiter"
homepage = "https://github.com/jedwards1230/gpu-arbiter"
readme = "README.md"
keywords = ["gpu", "gaming", "systemd", "ollama", "daemon"]
categories = ["command-line-utilities", "os::linux-apis", "os::windows-apis", "hardware-support"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "gpu-arbiter"
path = "src/main.rs"

[lib]
name = "gpu_arbiter"
path = "src/lib.rs"

[dependencies]
# Trimmed to what's used, not `full`: rt-multi-thread, macros, process, signal,
# sync, time, net, fs. Other deps pull their own tokio features transitively.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "sync",
    "time",
    "net",
    "fs",
] }
# CancellationToken for graceful shutdown of the reconcile task's own loop.
tokio-util = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
# JSON for the axum `/status` body. Pure-Rust; the serializer/deserializer also
# lets the HTTP contract be unit-tested on macOS.
serde_json = "1"
toml = "1.1"
# thiserror v2 (typed parse/netlink edges).
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
# Pure-Rust HTTP server on hyper (server-only, no reqwest/TLS). Note 0.8
# path-param syntax: `/{p}`.
axum = "0.8"
# join_all concurrently polls per-unit status on the /status refresh path.
# Pulled transitively via axum -> tower; declared directly since we use it.
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
] }

# Plain-HTTP client shared by the tray companion and the daemon's
# status/wait/watch subcommands. No TLS, keeping both binaries musl-clean.
ureq = { version = "3", default-features = false, features = ["json"] }

# cn_proc process detection needs a Linux-only netlink socket (neli, `async`
# feature). ksni/notify-rust back the gpu-arbiter-tray companion (D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
neli = { version = "0.7", features = ["async"] }
ksni = "0.3"
# Default features = zbus (pure Rust). Do NOT enable `d`/`dbus` (the libdbus FFI path).
notify-rust = "4"
# Local-presence detection (evdev/inotify are Linux kernel interfaces).
# tokio-stream drives the async inotify event stream.
evdev = { version = "0.13", features = ["tokio"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
tokio-stream = "0.1"

# Windows process enumeration backing `reconcile::observe`. `system` alone
# exposes the process list needed for a service binary running as LocalSystem.
[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# The `release` profile is what actually ships (the static musl binary built by
# rust.yml / release.yml) — optimize it for a small, standalone daemon binary
# over incremental-rebuild speed:
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
# Consistent with the poisoned-lock-abort policy in state.rs: a panic must
# terminate the process so systemd's `Restart=always` boots a fresh one,
# rather than leaving a tokio task silently dead while other handlers keep
# running. `cargo test` is unaffected — it runs under the dev/test profile.
panic = "abort"
