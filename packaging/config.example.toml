# gpu-arbiter daemon configuration — /etc/gpu-arbiter/config.toml
#
# Every key below is OPTIONAL. Each is serde-defaulted, so a sparse file
# overrides only the keys it names — and a MISSING file yields the full built-in
# defaults (the daemon is fully usable with zero configuration). The commented
# values shown are the defaults; uncomment and edit only what you want to change.
#
# Keys map 1:1 to the serde Config struct in src/config.rs. See
# gpu-arbiter-config(5) for the authoritative reference.
#
# An unknown/misspelled key (top-level, per-[[managed_units]], or
# per-[[game_patterns]]) fails to parse instead of silently doing nothing —
# run `gpu-arbiter --check-config` after editing this file.

# Master enable. When false, the daemon logs that it is disabled and exits
# cleanly (a quick disable without touching systemd).
#enabled = true

# HTTP listen port for the read-only surface (/status /metrics /healthz) and
# the deprecated TCP write routes, bound to `bind`.
#port = 48750

# TCP bind address for the HTTP control surface. Loopback-only by default;
# set this to a LAN address to let other hosts read /status and /metrics,
# and firewall the port yourself if you do.
#bind = "127.0.0.1"

# Unix control socket serving the write path (POST /units/{unit}/start|stop,
# /ollama/start|stop) — the sanctioned control surface: local root only, no
# bearer tokens, mode 0600 root-owned, inside a mode 0700 root-owned parent
# directory (the parent directory is itself part of the auth boundary — it
# closes the bind-then-chmod permission window; see gpu-arbiter-config(5)).
# An empty string disables the socket entirely, leaving only the deprecated,
# loopback-gated TCP write routes on `port`.
#socket_path = "/run/gpu-arbiter/gpu-arbiter.sock"

# Seconds to wait for a graceful tenant teardown (VRAM dropping below
# vram_free_threshold_mb) before escalating to SIGKILL.
#eviction_timeout_s = 5

# VRAM-used (MiB) strictly below this value means the GPU is considered "freed"
# after eviction.
#vram_free_threshold_mb = 2000

# Slow backstop reconcile interval (seconds). Detection itself is event-driven
# (cn_proc); this only covers dropped netlink events.
#reconcile_interval_s = 30

# Default budget (seconds) for a COOPERATIVE release, used by units that set
# yield_cmd but no per-unit yield_timeout_s. Deliberately shorter than
# eviction_timeout_s: this is the FIRST of two eviction stages and its budget is
# spent before the stop path even begins, so a generous value here directly
# delays a game getting the GPU. Tune it from the
# gpu_arbiter_eviction_duration_seconds{stage="yield"} histogram, not by guessing.
#yield_timeout_s = 3

# The priority a detected GAME claims at. Higher wins. The default sits above
# every unit's default priority (50), which is what makes gaming preempt
# everything. Lowering it below a tenant's priority would let that tenant
# survive a game launch — a real option (a tenant you never want interrupted),
# but a deliberate one.
#game_priority = 100

# GPU vendor backend: "auto" (nvidia-smi if present, else amdgpu sysfs, else
# nvidia), "nvidia", or "amd".
#gpu_backend = "auto"

# --- detection ---------------------------------------------------------------

# Match "SteamLaunch AppId=" in exec'd cmdlines (covers all Steam games).
#detect_steam = true

# Opt-in: treat heavy, non-allowlisted *graphics* GPU processes as games.
# (It cannot see Ollama, which is a compute process.)
#vram_heuristic = false

# VRAM threshold (MiB) for the opt-in vram_heuristic.
#vram_game_threshold_mb = 4000

# Sanctioned GPU tenants, used by the heuristic (and a sanity log line) to avoid
# flagging known-good processes as games. Each entry is matched
# case-insensitively (no substrings) against a proc's full name/path, its
# path basename (e.g. "1password" matches /opt/1Password/1password), and its
# owning systemd unit when cgroup attribution resolved one.
#gpu_allowlist = ["ollama", "kwin_wayland", "plasmashell", "Xwayland"]

# --- presence ----------------------------------------------------------------

# Watch physical input devices (keyboard/mouse/gamepad) to report local at-desk
# presence in /status and /metrics. Virtual devices injected by
# Moonlight/Sunshine streaming are excluded by sysfs parentage. When false,
# presence is not tracked and reported as unknown.
#presence_detection = true

# Seconds of physical-input silence after which local presence is reported as
# absent (local_present = 0).
#presence_idle_threshold_s = 600

# ------------------------------------------------------------------------------
# NOTE: every root-level key above this line MUST stay above this line. TOML
# assigns a bare `key = value` to the most recently opened table, not the file
# root — so an uncommented root key placed after one of the [[game_patterns]]
# or [[managed_units]] tables below would silently join THAT table instead of
# Config, and (since every table here carries deny_unknown_fields) fail to
# parse rather than apply. See the contract tests in src/config.rs.
# ------------------------------------------------------------------------------

# Cmdline-substring patterns for non-Steam launchers. Repeat the table per
# launcher. `name` becomes the claim `pattern:<name>`; `match` is the substring
# matched against a process cmdline.
#[[game_patterns]]
#name = "heroic"
#match = "Heroic"

# --- managed units -----------------------------------------------------------
#
# Ordered list of GPU tenants the arbiter evicts from the GPU on a game launch
# (each runs the same stop → poll-VRAM-free → SIGKILL loop, in order) and
# restores when gaming ends.
#
# If `managed_units` is omitted entirely, a single Ollama entry is synthesized
# from the legacy `ollama_unit` / `eager_ollama` keys (default
# "ollama.service", eager_restart = true, vram_match = "ollama",
# kind = "ollama"), so an unconfigured daemon evicts Ollama — and reports its
# loaded models via `ollama ps` — exactly as before.
#
# Tenant 1 — Ollama, driven by systemd (the default supervisor). VRAM
# attribution for a systemd unit is automatic via cgroup PID resolution — no
# vram_match needed; it's set below only to keep working on the (rare) VRAM
# heuristic / legacy fallback paths where cgroup data isn't available.
#[[managed_units]]
#unit = "ollama.service"        # systemd unit the daemon exclusively owns
#eager_restart = true           # restart this unit when gaming ends
#vram_match = "ollama"          # FALLBACK substring for /status VRAM attribution (optional; cgroup wins when it applies)
#kind = "ollama"                # introspection backend for /status models[] (optional; only "ollama" recognized)
#introspect_cmd = "ollama ps"   # explicit model-list command, overrides kind (optional)

# Tenant 2 — a second GPU server, also systemd-driven:
#[[managed_units]]
#unit = "vllm.service"
#eager_restart = true
#vram_match = "vllm"
#introspect_cmd = "vllm-cli list-models"

# --- the priority ladder & cooperative eviction -------------------------------
#
# Gaming-beats-everything is the floor, not the whole model. Tenants also rank
# against EACH OTHER, and a tenant that supports it can be asked to let go of
# the GPU without being killed.
#
# `priority` (default 50) is the tier. A demand at priority P preempts every
# unit with priority < P and leaves everything at >= P alone. The comparison is
# strict, so equal tiers coexist rather than fight — which is why a config that
# never mentions priorities behaves exactly as it did before the ladder existed.
#
# A unit only PREEMPTS a lower tier when its `busy_cmd` exits 0 ("I have work
# right now"). With no busy_cmd a unit is a preemption target only, never a
# source — the right default, since a merely-running server holding an idle
# model should not evict anything. The probe runs on EVERY reconcile pass, so it
# must be cheap and non-blocking; one that fails to spawn, times out, or exits
# non-zero reads as NOT busy, so a broken probe can't evict on a false pretext.
#
# `yield_cmd` adds a cooperative stage before the stop path: ask the tenant to
# drop the GPU while staying alive (for a PyTorch service, typically
# `model.cpu()` + `torch.cuda.empty_cache()`), then poll `busy_cmd` until it
# reports not busy. Exit 0 from yield_cmd means "request accepted", NOT "the GPU
# is free" — which is why release is confirmed by polling rather than trusted.
# On success the unit is never stopped: no in-flight work lost, no cold model
# reload after. On timeout or failure it falls through to the ordinary
# stop → poll-VRAM → SIGKILL path, so a tenant that ignores the request can
# never hold the GPU against a higher tier.
#
# !! yield_cmd WITHOUT busy_cmd DOES NOTHING. Release would be unobservable, so
# !! the daemon logs a warning, skips the yield stage entirely, and stops the
# !! unit. Always configure the two together.
#
# `resume_cmd` is the undo, run on the restore path before any start. It MUST be
# idempotent: the daemon deliberately does not track whether a unit was yielded
# or stopped (that state would have to survive a daemon restart to be
# trustworthy), so it runs resume unconditionally.
#
# Tune both budgets from the gpu_arbiter_eviction_duration_seconds{stage=...}
# histogram — the yield/stop split is what shows whether the cooperative stage
# is paying for itself or just adding latency ahead of an inevitable stop.
#[[managed_units]]
#unit = "asr.service"
#priority = 25                                  # below the default 50: yields to other tenants
#eager_restart = true
#busy_cmd = ["curl", "-sf", "http://127.0.0.1:9000/busy"]   # exit 0 = has work
#yield_cmd = ["curl", "-sfX", "POST", "http://127.0.0.1:9000/gpu/release"]
#resume_cmd = ["curl", "-sfX", "POST", "http://127.0.0.1:9000/gpu/acquire"]
#yield_timeout_s = 10                           # overrides the top-level default

# Non-systemd supervisor overrides (OpenRC / runit / plain processes).
# When ALL four *_cmd overrides are absent, the tenant is driven byte-for-byte by
# systemd (systemctl stop|start|is-active|kill). Set the overrides to drive a
# tenant without systemd. `unit` then becomes a free-form label, not a real unit.
#
# Each *_cmd is a SHELL-FREE argv — spawned directly, never via `sh -c`, so a
# unit name or path can't inject. Two equivalent spellings: a string array, or a
# single string split on ASCII whitespace (no quoting/escaping — use the array
# form if an argument must contain a space).
#[[managed_units]]
#unit = "ollama"                              # label only; not a systemd unit
#vram_match = "ollama"
#stop_cmd = ["rc-service", "ollama", "stop"]  # None → `systemctl stop`
#start_cmd = ["rc-service", "ollama", "start"] # None → `systemctl start`
#is_active_cmd = "rc-service ollama status"   # exit 0 = active; None → `systemctl is-active`
#kill_cmd = ["pkill", "-9", "ollama"]         # SIGKILL escalation; None off systemd re-runs stop_cmd
