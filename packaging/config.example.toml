# gpu-arbiter daemon configuration — /etc/gpu-arbiter/config.toml
#
# Every key below is OPTIONAL. Each is serde-defaulted, so a sparse file
# overrides only the keys it names — and a MISSING file yields the full built-in
# defaults (the daemon is fully usable with zero configuration). The commented
# values shown are the defaults; uncomment and edit only what you want to change.
#
# Keys map 1:1 to the serde Config struct in src/config.rs. See
# gpu-arbiter-config(5) for the authoritative reference.
#
# An unknown/misspelled key (top-level, per-[[managed_units]], or
# per-[[game_patterns]]) fails to parse instead of silently doing nothing —
# run `gpu-arbiter --check-config` after editing this file.

# Master enable. When false, the daemon logs that it is disabled and exits
# cleanly (a quick disable without touching systemd).
#enabled = true

# HTTP listen port for the read-only surface (/status /metrics /healthz),
# plus (on Windows only) the loopback-gated write routes, bound to `bind`.
#port = 48750

# TCP bind address for the HTTP control surface. Loopback-only by default;
# set this to a LAN address to let other hosts read /status and /metrics,
# and firewall the port yourself if you do.
#bind = "127.0.0.1"

# Unix control socket serving the write path (POST /units/{unit}/start|stop)
# on Linux: local root only, no bearer tokens, mode 0600 root-owned, inside a
# mode 0700 root-owned parent directory (the parent directory is itself part
# of the auth boundary — it closes the bind-then-chmod permission window;
# see gpu-arbiter-config(5)). An empty string disables the socket entirely,
# leaving Linux with no write path at all. Ignored on Windows, where the
# write routes are served on the TCP port instead, gated to loopback peers.
#socket_path = "/run/gpu-arbiter/gpu-arbiter.sock"

# Seconds to wait for a graceful tenant teardown (VRAM dropping below
# vram_free_threshold_mb, or on Windows the service reaching STOPPED) before
# escalating to SIGKILL / kill_cmd.
#eviction_timeout_s = 5

# VRAM-used (MiB) strictly below this value means the GPU is considered "freed"
# after eviction.
#vram_free_threshold_mb = 2000

# Slow backstop reconcile interval (seconds). Detection itself is event-driven
# (cn_proc); this only covers dropped netlink events.
#reconcile_interval_s = 30

# The priority a detected GAME claims at. Higher wins. The default sits above
# every unit's default priority (50), which is what makes gaming preempt
# everything. Lowering it below a tenant's priority would let that tenant
# survive a game launch — a real option (a tenant you never want interrupted),
# but a deliberate one.
#game_priority = 100

# Seconds the game-claim set must stay CONTINUOUSLY empty before `gaming` ends
# and tenants are resumed / restarted. A single pass that sees no game (a
# launcher handing off to the game binary, a scan between two processes) no
# longer restarts everything only for the next pass to evict it again. Inside
# the window /status stays `gaming`; a claim reappearing resets it. 0 restores
# the old immediate behavior. Needs gpu-arbiter >= 0.14.0 (older builds reject
# the key).
#game_exit_grace_s = 30

# DEPRECATED (0.14.0): yield_timeout_s (top level and per unit) and yield_cmd
# are still accepted so an older config keeps loading, but they do nothing —
# every eviction stops the unit. The daemon warns about them at startup and
# --check-config lists them; remove them.

# GPU vendor backend: "auto" (nvidia-smi if present, else amdgpu sysfs, else
# nvidia), "nvidia", or "amd".
#gpu_backend = "auto"

# --- detection ---------------------------------------------------------------

# Match "SteamLaunch AppId=" in exec'd cmdlines (covers all Steam games).
#detect_steam = true

# --- presence ----------------------------------------------------------------

# Watch physical input devices (keyboard/mouse/gamepad) to report local at-desk
# presence in /status and /metrics. Virtual devices injected by
# Moonlight/Sunshine streaming are excluded by sysfs parentage. When false,
# presence is not tracked and reported as unknown.
#presence_detection = true

# Seconds of physical-input silence after which local presence is reported as
# absent (local_present = 0).
#presence_idle_threshold_s = 600

# ------------------------------------------------------------------------------
# NOTE: every root-level key above this line MUST stay above this line. TOML
# assigns a bare `key = value` to the most recently opened table, not the file
# root — so an uncommented root key placed after one of the [[game_patterns]]
# or [[managed_units]] tables below would silently join THAT table instead of
# Config, and (since every table here carries deny_unknown_fields) fail to
# parse rather than apply. See the contract tests in src/config.rs.
# ------------------------------------------------------------------------------

# Cmdline-substring patterns for non-Steam launchers. Repeat the table per
# launcher. `name` becomes the claim `pattern:<name>`; `match` is the substring
# matched against a process cmdline.
#[[game_patterns]]
#name = "heroic"
#match = "Heroic"

# --- managed units -----------------------------------------------------------
#
# Ordered list of GPU tenants the arbiter evicts from the GPU on a game launch
# (each runs the same stop → poll-VRAM-free → SIGKILL loop, in order) and
# restores when gaming ends.
#
# If `managed_units` is omitted entirely, it defaults to a single entry —
# unit = "ollama.service", eager_restart = true, vram_match = "ollama",
# kind = "ollama" — so an unconfigured daemon evicts Ollama and reports its
# loaded models via its HTTP API (GET http://127.0.0.1:11434/api/ps) with zero
# setup — no `ollama` CLI needed on the daemon's PATH.
#
# Tenant 1 — Ollama, driven by systemd (the default supervisor). VRAM
# attribution for a systemd unit is automatic via cgroup PID resolution — no
# vram_match needed; it's set below as the fallback used whenever cgroup
# resolution doesn't produce a match for a given poll, which is always the
# case for command-driven units and non-systemd hosts (no cgroup ever
# resolves to their free-form label) and can also happen occasionally for a
# systemd unit if that poll's process listing hasn't resolved its cgroup yet.
#[[managed_units]]
#unit = "ollama.service"        # systemd unit the daemon exclusively owns
#eager_restart = true           # restart this unit when gaming ends
#vram_match = "ollama"          # FALLBACK substring for /status VRAM attribution (optional; cgroup wins when it applies)
#kind = "ollama"                # introspection backend for /status models[] (optional; only "ollama" recognized)
#ollama_url = "http://127.0.0.1:11434"  # Ollama API queried for models[] (optional; default shown; http:// only)
#introspect_cmd = "vllm-cli list-models"  # explicit model-list command, overrides kind (optional)

# Tenant 2 — a second GPU server, also systemd-driven:
#[[managed_units]]
#unit = "vllm.service"
#eager_restart = true
#vram_match = "vllm"
#introspect_cmd = "vllm-cli list-models"

# --- the priority ladder --------------------------------------------------------
#
# `priority` (default 50) sets a tenant's tier; a demand at P preempts every
# unit with priority < P. `busy_cmd` (exit 0 = busy, exit 1 = idle; any other
# code also reads idle, so `curl -sf` probes work) is required for a unit to
# preempt anything — without it, a unit can only be preempted, never preempt.
# A preempted tenant is STOPPED, exactly like a game eviction, and restarted
# (if eager_restart) once nothing above it is busy. `resume_cmd` is an
# idempotent "you may use the GPU again" hook, run once after the unit is
# brought back and once at daemon startup — use it to clear tenant-side park
# flags. Full treatment: docs/reference.md#priority-ladder.
#[[managed_units]]
#unit = "asr.service"
#priority = 25                                  # below the default 50: preempted by other tenants
#eager_restart = true
#busy_cmd = ["curl", "-sf", "http://127.0.0.1:9000/busy"]   # exit 0 = has work; HTTP error = idle
#resume_cmd = ["curl", "-sfX", "POST", "http://127.0.0.1:9000/gpu/acquire"]

# Non-systemd supervisor overrides (OpenRC / runit / plain processes).
# When ALL four *_cmd overrides are absent, the tenant is driven byte-for-byte by
# systemd (systemctl stop|start|is-active|kill). Set the overrides to drive a
# tenant without systemd. `unit` then becomes a free-form label, not a real unit.
#
# Each *_cmd is a SHELL-FREE argv — spawned directly, never via `sh -c`, so a
# unit name or path can't inject. Two equivalent spellings: a string array, or a
# single string split on ASCII whitespace (no quoting/escaping — use the array
# form if an argument must contain a space).
#[[managed_units]]
#unit = "ollama"                              # label only; not a systemd unit
#vram_match = "ollama"
#stop_cmd = ["rc-service", "ollama", "stop"]  # None → `systemctl stop`
#start_cmd = ["rc-service", "ollama", "start"] # None → `systemctl start`
#is_active_cmd = "rc-service ollama status"   # exit 0 = active; None → `systemctl is-active`
#kill_cmd = ["pkill", "-9", "ollama"]         # SIGKILL escalation; None off systemd re-runs stop_cmd
